   <!-- БЛОК 5 -->

<section class="block5 reveal">
  <img class="block5-img" src="img/11.png" alt="">

<!-- БЛОК 6 -->

<section class="block6 reveal">

  <div class="block6-top">
    <img class="block6-img" src="img/12.png" alt="">

    <button class="block6-open-btn" id="openFormBtn" type="button">
      <img src="img/13.png" alt="">
    </button>
  </div>

  <div class="block6-form-wrap" id="block6FormWrap">
    <form class="block6-form" id="block6Form" action="https://api.web3forms.com/submit" method="POST">

  <!-- сюда вставь свой ключ Web3Forms -->
  <input type="hidden" name="access_key" value="45e630ea-3ad9-4310-8053-5887ebe5861a">

  <input type="hidden" name="subject" value="Новая анкета с приглашения">
  <input type="hidden" name="from_name" value="Свадебное приглашение">

  <input
    class="block6-input"
    type="text"
    name="ФИО"
    placeholder="Введите ваше ФИО"
    required
  >

  <div class="block6-group">
    <p class="block6-group-title">Подтвердите присутствие</p>

    <label class="block6-option">
      <input type="radio" name="Присутствие" value="Да, я с удовольствием приду" required>
      <span>Да, я с удовольствием приду</span>
    </label>

    <label class="block6-option">
      <input type="radio" name="Присутствие" value="К сожалению, не смогу присутствовать">
      <span>К сожалению, не смогу присутствовать</span>
    </label>
  </div>

  <div class="block6-group">
  <p class="block6-group-title">Будете одни или с парой?</p>

  <label class="block6-option">
    <input type="radio" name="Гость" value="Буду один/одна" required>
    <span>Буду один/одна</span>
  </label>

  <label class="block6-option">
    <input type="radio" name="Гость" value="Буду с парой" id="withPartner">
    <span>Буду с парой</span>
  </label>
</div>

<div class="block6-extra-field" id="partnerField">
  <input
    class="block6-input"
    type="text"
    name="ФИО второго человека"
    placeholder="Введите ФИО второго человека"
  >
</div>

  <div class="block6-group">
    <p class="block6-group-title">Предпочтения в алкоголе</p>

    <label class="block6-option">
      <input type="checkbox" name="Алкоголь" value="Вино">
      <span>Вино</span>
    </label>

    <label class="block6-option">
      <input type="checkbox" name="Алкоголь" value="Шампанское">
      <span>Шампанское</span>
    </label>

    <label class="block6-option">
      <input type="checkbox" name="Алкоголь" value="Водка">
      <span>Водка</span>
    </label>

    <label class="block6-option">
      <input type="checkbox" name="Алкоголь" value="Авторский дистиллят">
      <span>Авторский дистиллят</span>
    </label>
  </div>

  <div class="block6-group">
  <p class="block6-group-title">Есть ли аллергические реакции?</p>

  <label class="block6-option">
    <input type="radio" name="Аллергия" value="Нет" required>
    <span>Нет</span>
  </label>

  <label class="block6-option">
    <input type="radio" name="Аллергия" value="Да" id="hasAllergy">
    <span>Да</span>
  </label>
</div>

<div class="block6-extra-field" id="allergyField">
  <input
    class="block6-input"
    type="text"
    name="На что аллергия"
    placeholder="Если да, укажите на что аллергия"
  >
</div>

  <button class="block6-submit-btn" type="submit">
    <img src="img/18.png" alt="">
  </button>

</form>
  </div>

</section>

      <div class="time-item">
        <span id="days">00</span>

      </div>

      <div class="time-item">
        <span id="hours">00</span>

      </div>

      <div class="time-item">
        <span id="minutes">00</span>
        <p>Минут</p>
      </div>

      <div class="time-item">
        <span id="seconds">00</span>
        <p>Секунд</p>
      </div>
    </div>
